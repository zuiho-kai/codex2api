name: Diag n150 codex2api (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, Linux, X64, n150-codex2api]
    timeout-minutes: 5
    steps:
      - name: Read-only DB diagnostics (secrets redacted)
        run: |
          python3 - <<'PY' | sed -E 's/[A-Za-z0-9_\.\/+=-]{40,}/<redacted>/g'
          import sqlite3, json
          db = sqlite3.connect('file:/var/lib/docker/volumes/codex2api-sqlite_sqlite-data/_data/codex2api.db?mode=ro', uri=True)
          tables = [r[0] for r in db.execute("select name from sqlite_master where type='table'")]
          print('tables:', tables)
          def dump(sql, n=40):
              try:
                  cur = db.execute(sql); cols = [d[0] for d in cur.description]
                  for row in cur.fetchmany(n):
                      print(json.dumps(dict(zip(cols, row)), ensure_ascii=False, default=str)[:700])
              except Exception as e:
                  print('ERR', sql[:80], e)
          print('== account_model_cooldowns'); dump('select * from account_model_cooldowns')
          print('== accounts'); dump("select id,status,cooldown_reason,cooldown_until,error_message,image_quota_remaining,image_quota_total,today_used_count,updated_at from accounts where deleted_at is null")
          print('== image usage today'); dump("select created_at,endpoint,status_code,duration_ms,image_size,is_retry_attempt,attempt_index,upstream_error_kind,upstream_endpoint,error_message from usage_logs where model like 'gpt-image%' and created_at > '2026-10-14 20:00' order by id desc", 80)
          print('== status by day'); dump("select substr(created_at,1,13) h, status_code, count(*) n from usage_logs where model like 'gpt-image%' and created_at > '2026-10-13' group by 1,2 order by 1 desc", 80)
          PY
